<html lang="en"><head><meta charset="UTF-8">

<title>Danniel Ribeiro, Ph.D.</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111110;--ink:#E8E1D4;--ac:#C85C3C;--mu:#9A948B;--dm:rgba(232,225,212,.06);--db:rgba(232,225,212,.12);
  --sans:'Inter',system-ui,sans-serif;--serif:'Source Serif 4',Georgia,serif;--mono:'JetBrains Mono',monospace;
  --rad:4px;--fs:16px
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:var(--fs);line-height:1.6;-webkit-font-smoothing:antialiased}

/* HERO */
#hero{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;transition:opacity .6s,visibility .6s}
#hero.h{opacity:0;visibility:hidden;pointer-events:none}
#hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 20%;filter:brightness(.28)}
#hero .ct{position:relative;z-index:2;text-align:center;padding:24px}
#hero h1{font-family:var(--serif);font-size:clamp(36px,7vw,56px);font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
#hero .tg{font-family:var(--sans);font-size:clamp(12px,1.6vw,15px);color:var(--mu);letter-spacing:.22em;text-transform:uppercase;margin-bottom:28px}
.hph{display:flex;gap:5px;justify-content:center;margin-bottom:32px}
.hph img{height:clamp(55px,9vw,75px);width:auto;border-radius:var(--rad);opacity:.7;transition:opacity .3s}
.hph img:hover{opacity:1}
.ebtn{font-family:var(--sans);font-size:13px;color:var(--ac);letter-spacing:.28em;text-transform:uppercase;border:1.5px solid var(--ac);padding:14px 36px;cursor:pointer;border-radius:var(--rad);transition:all .25s;font-weight:500;display:inline-block}
.ebtn:hover{background:var(--ac);color:var(--bg)}

/* APP */
#app{display:flex;flex-direction:column;height:100vh;min-height:500px}

/* HEADER with photos */
#hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--db);flex-shrink:0;gap:12px}
#hdr .left{display:flex;align-items:center;gap:14px}
#hdr .pics{display:flex;gap:3px}
#hdr .pics img{height:32px;width:auto;border-radius:2px;opacity:.8}
#hdr h1{font-family:var(--serif);font-size:17px;font-weight:600;cursor:pointer;white-space:nowrap}
#hdr h1:hover{color:var(--ac)}
#hdr .phd{font-family:var(--mono);font-size:10px;color:var(--mu);margin-left:6px;font-weight:400}
#hdr .tag{font-family:var(--sans);font-size:11px;color:var(--mu);letter-spacing:.1em}

/* NAV */
#nav{display:flex;border-bottom:1px solid var(--db);flex-shrink:0}
.nb{flex:1;padding:13px 8px;border:none;cursor:pointer;background:0;border-bottom:2.5px solid transparent;font-family:var(--sans);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);transition:all .2s;font-weight:500}
.nb.on{background:rgba(200,92,60,.06);border-bottom-color:var(--ac);color:var(--ink)}
.nb:hover:not(.on){color:var(--ink);background:var(--dm)}

/* CONTENT */
#ct{flex:1;overflow:hidden;position:relative}
.pane{display:none;width:100%;height:100%;position:absolute;inset:0;flex-direction:column}.pane.on{display:flex}

/* SUBTABS */
.stabs{display:flex;gap:0;border-bottom:1px solid var(--db);flex-shrink:0;background:rgba(200,92,60,.02)}
.stab{padding:8px 16px;border:none;cursor:pointer;background:0;font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);transition:all .15s;font-weight:500;border-bottom:2px solid transparent}
.stab.on{color:var(--ink);border-bottom-color:var(--ac)}

/* CARDS (work selector) */
.cards{display:flex;gap:1px;background:var(--db);flex-shrink:0}
.cards button{flex:1;padding:10px 12px;border:none;cursor:pointer;text-align:left;background:var(--bg);transition:all .15s;position:relative}
.cards button.on{background:rgba(200,92,60,.05)}
.cards button.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--ac)}
.cards .y{font-family:var(--mono);font-size:9px;color:var(--mu);letter-spacing:.1em;margin-bottom:2px}
.cards .t{font-family:var(--serif);font-size:clamp(12px,1.2vw,15px);font-style:italic;color:var(--mu);line-height:1.3}
.cards button.on .t{color:var(--ink)}
.cards button:hover:not(.on) .t{color:var(--ink)}

/* SPLIT */
.row{display:flex;flex:1;min-height:0}
.vw{flex:1.4;position:relative;overflow:hidden;background:#f0ede8;min-width:0}
.ip{flex:1;padding:20px 24px;overflow-y:auto;border-left:1px solid var(--db);min-width:300px;max-width:500px}

/* SCORE VIEWER - FIXED ZOOM */
.sv{width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:zoom-in;position:relative}
.sv img{max-width:100%;max-height:100%;object-fit:contain;transition:none;user-select:none}
.sv.z{overflow:auto;cursor:grab;align-items:flex-start;justify-content:flex-start}
.sv.z img{max-width:none;max-height:none;width:220%;cursor:grab}

/* SCORE NAV */
.sn{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;z-index:10}
.sn button{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:rgba(17,17,16,.88);backdrop-filter:blur(8px);border:1px solid rgba(232,225,212,.2);color:var(--ink);font-size:18px;border-radius:var(--rad);cursor:pointer;transition:background .15s}
.sn button:hover{background:rgba(200,92,60,.5)}
.sn span{font-family:var(--mono);font-size:12px;color:var(--ink);background:rgba(17,17,16,.88);padding:8px 16px;border-radius:var(--rad);letter-spacing:.05em}

/* INFO PANEL */
.lbl{font-family:var(--sans);font-size:11px;color:var(--ac);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px;font-weight:500}
.ip h2{font-family:var(--serif);font-size:clamp(20px,2.5vw,28px);font-weight:400;font-style:italic;line-height:1.2;margin-bottom:8px}
.inst{font-family:var(--sans);font-size:13px;color:var(--mu);margin-bottom:5px;line-height:1.5}
.det{font-family:var(--sans);font-size:12px;color:var(--mu);margin-bottom:12px}
.desc{font-size:15px;color:rgba(232,225,212,.78);line-height:1.7;margin-bottom:18px}.desc em{color:var(--ink)}
.sep{border-top:1px solid var(--dm);padding-top:14px;margin-top:16px}
.link{display:inline-flex;align-items:center;gap:5px;padding:8px 16px;border:1.5px solid var(--db);color:var(--mu);text-decoration:none;font-family:var(--sans);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px;margin-top:8px;border-radius:var(--rad);transition:all .2s;font-weight:500}
.link:hover,.link.hi{border-color:var(--ac);color:var(--ac)}
.lang{font-family:var(--sans);font-size:11px;color:var(--mu);cursor:pointer;padding:5px 10px;border:1.5px solid var(--db);background:0;margin-right:4px;border-radius:var(--rad);font-weight:500;transition:all .15s}
.lang.on{color:var(--ink);border-color:var(--ac);background:rgba(200,92,60,.08)}

/* AUDIO PLAYER */
.ap{margin-top:14px;padding:14px;background:rgba(200,92,60,.04);border:1px solid rgba(200,92,60,.1);border-radius:var(--rad)}
.ap .al{font-family:var(--sans);font-size:11px;color:var(--ac);letter-spacing:.06em;margin-bottom:3px;font-weight:500}
.ap .asub{font-family:var(--sans);font-size:10px;color:var(--mu);margin-bottom:8px}
.ap audio{width:100%;height:40px;outline:none;border-radius:var(--rad)}

/* PERFORMANCE */
.pfv{flex:1.4;position:relative;overflow:hidden;min-width:0}
.pfv>img{width:100%;height:100%;object-fit:cover;opacity:.4;transition:opacity .3s}
.pfv .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pbtn{width:80px;height:80px;border-radius:50%;border:2px solid var(--ac);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .25s;margin-bottom:16px}
.pbtn:hover{background:rgba(200,92,60,.2);transform:scale(1.05)}

/* FULL-WIDTH TEXT (Research/Contact) - TWO COLUMN */
.fw2{display:flex;height:100%;width:100%}
.fw2 .txt{flex:1;padding:clamp(20px,3vw,40px) clamp(20px,4vw,48px);overflow-y:auto}
.fw2 .aside{width:clamp(250px,25vw,380px);border-left:1px solid var(--db);overflow:hidden;display:flex;flex-direction:column}
.fw2 .aside img{width:100%;height:50%;object-fit:cover;opacity:.7}
.fw2 h2{font-family:var(--serif);font-size:clamp(20px,2.5vw,28px);font-weight:400;margin-bottom:16px;line-height:1.25}
.fw2 p{font-size:clamp(14px,1.1vw,16px);color:rgba(232,225,212,.82);line-height:1.72;margin-bottom:18px;max-width:700px}
.fw2 p em{color:var(--ink)}.fw2 p strong{color:var(--ink);font-weight:500}
.cred{font-size:14px;color:var(--mu);margin-bottom:6px;line-height:1.5}.cred strong{color:var(--ink);font-weight:500}
.cred a{color:var(--ac);text-decoration:none}.cred a:hover{text-decoration:underline}
.clink{display:flex;align-items:center;gap:12px;color:var(--ink);text-decoration:none;font-family:var(--sans);font-size:14px;padding:12px 0;border-bottom:1px solid var(--dm);transition:color .15s}.clink:hover{color:var(--ac)}
.ci{color:var(--ac);font-size:15px;width:22px;text-align:center;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pills span{font-size:12px;color:var(--mu);border:1px solid var(--db);padding:5px 12px;border-radius:var(--rad);font-family:var(--sans)}
.phr{display:flex;gap:4px;margin-top:14px}.phr img{height:clamp(55px,6vw,75px);width:auto;object-fit:cover;border-radius:var(--rad);opacity:.8;cursor:pointer;transition:all .2s}.phr img:hover{opacity:1}
.ow{font-size:13px;color:var(--mu);padding:10px 0;border-bottom:1px solid var(--dm);line-height:1.5}.ow strong{color:var(--ink);font-weight:500;font-style:italic}.ow .oy{font-family:var(--mono);font-size:10px;color:var(--ac);margin-right:8px}.ow a{color:var(--ac);text-decoration:none;font-size:11px}.ow a:hover{text-decoration:underline}
.resimg{width:100%;border-radius:var(--rad);opacity:.8}.vdemo{margin-top:14px}.vdemo video{width:100%;border-radius:var(--rad)}.vdemo .vl{font-family:var(--sans);font-size:11px;color:var(--ac);letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;font-weight:500}
.patchimg{width:100%;border-radius:var(--rad);margin:10px 0}

/* LIGHTBOX */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:200;align-items:center;justify-content:center;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:96%;max-height:94%;object-fit:contain;border-radius:var(--rad)}

/* BOTTOM */
#bot{display:flex;align-items:center;justify-content:space-between;padding:8px 20px;border-top:1px solid var(--db);font-family:var(--sans);font-size:10px;color:var(--mu);flex-shrink:0;letter-spacing:.02em}
#bot a{color:var(--mu);text-decoration:none}#bot a:hover{color:var(--ac)}

/* RESPONSIVE */
@media(max-width:900px){.row{flex-direction:column}.ip{border-left:none;border-top:1px solid var(--db);max-width:none;min-width:0;max-height:45vh}.vw,.pfv{min-height:35vh}#hdr .tag{display:none}.fw2{flex-direction:column}.fw2 .aside{width:100%;height:200px;border-left:none;border-top:1px solid var(--db)}}
@media(max-width:600px){.nb{font-size:9px;padding:10px 4px;letter-spacing:.06em}.cards{flex-wrap:wrap}.cards button{min-width:45%}.ip{padding:16px}.fw2 .txt{padding:16px}#hdr .pics{display:none}}
</style></head><body>

const ECP="media/img-12.jpg";
const ECT="media/img-13.jpg";
const PPU="media/img-14.jpg";
const PST="media/img-15.jpg";

const PDK="media/img-17.jpg";

const AEC3="media/audio-21.mp3";

const SP={outpouring:["media/img-27.jpg","media/img-28.jpg","media/img-29.jpg","media/img-30.jpg","media/img-31.jpg","media/img-32.jpg","media/img-33.jpg","media/img-34.jpg","media/img-35.jpg","media/img-36.jpg"],barrens:["media/img-37.jpg","media/img-38.jpg","media/img-39.jpg","media/img-40.jpg","media/img-41.jpg","media/img-42.jpg","media/img-43.jpg","media/img-44.jpg","media/img-45.jpg","media/img-46.jpg"],shaped:["media/img-47.jpg","media/img-48.jpg","media/img-49.jpg","media/img-50.jpg","media/img-51.jpg","media/img-52.jpg","media/img-53.jpg","media/img-54.jpg","media/img-55.jpg","media/img-56.jpg"]};

const WK=[
{id:'ec',t:'entrecorpo',y:'2025',ie:'Prepared guitars, tabletop cello, accessory instruments, objects & live electronics',ip:'Guitarras preparadas, violoncelo de mesa, instrumentos acess\u00f3rios, objetos e eletr\u00f4nica ao vivo',de:"Hybrid work \u00b7 Parts I\u2013VII \u00b7 85'",dp:"Obra h\u00edbrida \u00b7 Partes I\u2013VII \u00b7 85'",ce:'Dissertation work \u00b7 UC Berkeley (CNMAT) \u00b7 Advised by Edmund Campion',cp:'Obra de doutorado \u00b7 UC Berkeley (CNMAT) \u00b7 Orienta\u00e7\u00e3o de Edmund Campion',ne:'A multi-station solo performance environment. The score exists as two complementary maps: <em>entrelugar</em> (as passage) and <em>entrecorpo</em> (as territory). The performer navigates the ecology by choosing pathways, each station presenting its own instrumental configuration and notational vocabulary.',np:'Ambiente de performance solo multi-esta\u00e7\u00e3o. A partitura existe como dois mapas complementares: <em>entrelugar</em> (como passagem) e <em>entrecorpo</em> (como territ\u00f3rio), onde todas as possibilidades coexistem.',pp:[ECP,ECT],lk:`<a class="link hi" href="${EC_ALBUM}" target="_blank">\u25b6 Recordings (album)</a><a class="link" href="https://escholarship.org/uc/item/1pn3g5ps" target="_blank">Dissertation \u2197</a>`,au:[{s:AEC3,n:'a stone that bears my name (entrecorpo III)',sub:'Solo prepared electric guitar (magnets, honey dipper, E-Bow) \u00b7 Performed by Danniel Ribeiro'},{s:AEC4,n:'where gesture bleeds (entrecorpo IV)',sub:'Horizontal tabletop guitar + cello, mallets, bows, plastic knives \u00b7 Performed by Danniel Ribeiro'}]},

const RES={
en:`<div class="lbl">Research</div>
<h2>How the work generates its ideas</h2>
<p>My work as a composer, performer, and sound artist investigates how instruments can be expanded, combined, and reconfigured to produce new musical situations. I build hybrid instrumental ecologies: performance environments where acoustic instruments, preparations, objects, transducers, contact microphones, and live electronics operate as a single interconnected system rather than as separate layers.</p>
<p>In notated works for ensembles, this takes the form of bespoke techniques and shared instruments that redistribute the roles of performers. In <em>outpouring beneath my skin</em> (2024), written for collective lovemusic, four musicians share a central prepared snare drum fitted with guitar strings, transducers, and a singing bowl, while chair-string slingshots and corrugated tubes extend each player's reach. The notation combines chronometric time-strips, ritornello blocks with performer-chosen ordering, and graphic supplementary staves. In <em>beyond the barrens</em> (2023), written for Schallfeld Ensemble, gestures coexist in stratified layers, and the score acknowledges that performers carry different cultural relationships to notational accuracy, with references to the Sert\u00e3o of Brazil\u2019s Northeast as a lived and imagined space. In <em>shaped and already gone</em> (2023), written for Yarn/Wire, frameworks for physical interaction between performers and objects are re-encoded as notation, and Afro-Brazilian rhythmic materials and instrumentalized objects form the poetic spine of the work and inform its formal decisions.</p>
<p>In solo performance, <em>entrecorpo</em> (2025) brings these concerns into a single body navigating a multi-station environment of prepared electric guitars, a tabletop cello, objects, and a real-time processing system built in Max/MSP. The processing architecture uses corpus-based concatenative synthesis (CataRT, FluCoMa), machine-listening feedback (Somax), physical modeling (Modalys), and spectral manipulation in a recursive system where the machine's output feeds back into its own analysis, producing emergent sonic behaviors at the margins of the performer's control.</p>
<p>Performance is the other half of this research. I improvise on prepared and electronically mediated electric guitar, with recent collaborations at SFsound\u2019s West Oakland Sound Series, the Berkeley Center for New Media, New Performance Traditions (Dresher Ensemble), and the gallery 2727 California St. In collaborative improvisation, <em>the glitch bloom</em> with Eda Er explores how two performers with distinct instrumental practices build a shared sonic territory through sustained dialogue rather than predetermined structure.</p>
<p>My theoretical frame comes from Brazilian postcolonial thought, particularly Silviano Santiago\u2019s <em>entre-lugar</em>, the in-between place, through which I approach hybrid instrumental configurations as sites where agency, cultural relation, and material inheritance are tested through sound. My doctoral dissertation, <em>Syncretic Instrumentality and the Utopian Gesture: entrecorpo and Three Works for Hybrid Instrumental Ecologies</em> (<a href="https://escholarship.org/uc/item/1pn3g5ps" target="_blank" style="color:var(--ac)">UC Berkeley, 2025</a>), develops two central concepts: <em>instrumentalidade sincr\u00e9tica</em>, naming the condition where acoustic and electronic components constitute a single performative body, and the <em>gesto ut\u00f3pico</em>, orienting the performer toward what the ecology cannot yet do.</p>
<a class="link hi" href="https://escholarship.org/uc/item/1pn3g5ps" target="_blank">Dissertation \u2197</a>
<a class="link" href="https://escholarship.mcgill.ca/concern/theses/ks65hf631" target="_blank">Master's Thesis \u2197</a>
<div class="sep"><div class="lbl">Software: Max/MSP Performance System</div>
<p>The <em>entrecorpo</em> performance patch is a multi-modal, multi-instrument processing system integrating nine interconnected modules. Real-time corpus building feeds levels of concatenative synthesis (CataRT, FluCoMa), while Somax provides machine-listening-driven generative responses. These interact recursively with physical modeling (Modalys), spectral freezing, granular manipulation, and Karplus-Strong synthesis, generating an automated feedback system that pushes the processing toward marginal, emergent behaviors beyond direct performer control.</p>
<img class="patchimg" src="${PPATCH}" alt="entrecorpo performance patch" onclick="olb(this.src)">
<div class="vdemo"><div class="vl">Processing Demo</div><video controls preload="metadata" src="${VDEMO}" style="width:100%;max-width:640px;border-radius:4px"></video></div>
</div>
<div class="sep"><div class="lbl" style="margin-bottom:12px">Teaching</div>
<p><strong>Graduate Student Instructor & Associate Instructor, <a href="https://music.berkeley.edu" target="_blank" style="color:var(--ac)">UC Berkeley</a> (2020\u20132025)</strong><br>Six courses in music technology, composition, theory, perception/cognition, and interdisciplinary studies: Sound and Music Computing with CNMAT Technologies (Music 158A, instructor of record), Music Perception and Cognition (Music 108), Radical Listening (Music 31), Music Now (Music 29), Undergraduate Composition (Music 155, guest instructor), and the UC Berkeley Symphony Orchestra (Music 141, Personnel Manager and Instructor; 8 large-scale public concerts annually). Classes from 20 to 400 students. Developed instructional materials and hybrid technical labs at <a href="https://cnmat.berkeley.edu" target="_blank" style="color:var(--ac)">CNMAT</a>. Outstanding Graduate Student Instructor Award (2022).</p>
<p><strong>Research Assistant & Instructor, <a href="https://www.mcgill.ca/music/" target="_blank" style="color:var(--ac)">McGill University</a> (2016\u20132018)</strong><br>Research assistant to Christoph Neidh\u00f6fer in music theory, preparing music examples for his peer-reviewed research on Camillo Togni and Brian Cherney. Research assistant at the Digital Composition Studios, operating Max/MSP patches and electronic parts for mixed-music concerts. Notation workshops for performance majors at the Marvin Duchow Music Library.</p>
<p><strong>Production Assistant/Manager, Composer & Lecturer, Festival M\u00fasica de Agora na Bahia (2012\u20132015)</strong><br>Multi-year contemporary music project funded by Petrobras: nearly 100 events, including over 40 premieres by Brazilian composers, international guest artists, professional workshops, and educational outreach for public-school students.</p></div>

pt:`<div class="lbl">Pesquisa</div>
<h2>Como a pr\u00e1tica gera suas ideias</h2>
<p>Meu trabalho como compositor, performer e artista sonoro investiga como instrumentos podem ser expandidos, combinados e reconfigurados para produzir novas situa\u00e7\u00f5es musicais. Construo ecologias instrumentais h\u00edbridas: ambientes de performance onde instrumentos ac\u00fasticos, prepara\u00e7\u00f5es, objetos, transdutores, microfones de contato e eletr\u00f4nica ao vivo operam como um sistema \u00fanico e interconectado.</p>
<p>Em obras notadas para ensembles, isso se d\u00e1 atrav\u00e9s de t\u00e9cnicas espec\u00edficas e instrumentos compartilhados que redistribuem os pap\u00e9is dos performers. Em <em>outpouring beneath my skin</em> (2024), escrita para collective lovemusic, quatro m\u00fasicos compartilham uma caixa preparada central com cordas de guitarra, transdutores e singing bowl, enquanto estilingues de cadeira-corda e tubos corrugados estendem o alcance de cada performer. Em <em>beyond the barrens</em> (2023), para Schallfeld Ensemble, f\u00f3rmulas de compasso incompletas fraturam a grade m\u00e9trica enquanto o interior do piano \u00e9 tocado com arco atrav\u00e9s de papel\u00e3o.</p>
<p>Em performance solo, <em>entrecorpo</em> (2025) concentra essas preocupa\u00e7\u00f5es em um \u00fanico corpo navegando um ambiente multi-esta\u00e7\u00e3o. A arquitetura de processamento usa s\u00edntese concatenativa baseada em corpus (CataRT, FluCoMa), feedback por escuta de m\u00e1quina (Somax), modelagem f\u00edsica (Modalys) e manipula\u00e7\u00e3o espectral em um sistema recursivo que produz comportamentos sonoros emergentes nas margens do controle do performer.</p>
<a class="link hi" href="https://escholarship.org/uc/item/1pn3g5ps" target="_blank">Tese de Doutorado \u2197</a>
<a class="link" href="https://escholarship.mcgill.ca/concern/theses/ks65hf631" target="_blank">Disserta\u00e7\u00e3o de Mestrado \u2197</a>
<div class="sep"><div class="lbl">Software: Sistema de Performance Max/MSP</div>
<p>O patch de performance de <em>entrecorpo</em> \u00e9 um sistema multi-modal que integra nove m\u00f3dulos interconectados. Constru\u00e7\u00e3o de corpus em tempo real alimenta n\u00edveis de s\u00edntese concatenativa (CataRT, FluCoMa), enquanto Somax fornece respostas generativas por machine-listening. Esses interagem recursivamente com modelagem f\u00edsica (Modalys), congelamento espectral, manipula\u00e7\u00e3o granular e s\u00edntese Karplus-Strong, gerando um sistema de feedback automatizado que empurra o processamento para comportamentos marginais e emergentes.</p>
<img class="patchimg" src="${PPATCH}" alt="patch de performance" onclick="olb(this.src)">
<div class="vdemo"><div class="vl">Demo de Processamento</div><video controls preload="metadata" src="${VDEMO}" style="width:100%;max-width:640px;border-radius:4px"></video></div>
</div>
<div class="sep"><div class="lbl" style="margin-bottom:12px">Ensino</div>
<p><strong>Graduate Student Instructor e Associate Instructor, <a href="https://music.berkeley.edu" target="_blank" style="color:var(--ac)">UC Berkeley</a> (2020\u20132025)</strong><br>Seis disciplinas em tecnologia musical, composi\u00e7\u00e3o, teoria, percep\u00e7\u00e3o/cogni\u00e7\u00e3o e estudos interdisciplinares: Sound and Music Computing with CNMAT Technologies (Music 158A, professor respons\u00e1vel), Music Perception and Cognition (Music 108), Radical Listening (Music 31), Music Now (Music 29), Composi\u00e7\u00e3o (Music 155, professor convidado) e Orquestra Sinf\u00f4nica da UC Berkeley (Music 141, Personnel Manager e instrutor; 8 concertos p\u00fablicos anuais). Turmas de 20 a 400 alunos. Outstanding GSI Award (2022).</p>
<p><strong>Assistente de Pesquisa e Instrutor, <a href="https://www.mcgill.ca/music/" target="_blank" style="color:var(--ac)">McGill University</a> (2016\u20132018)</strong><br>Assistente de pesquisa de Christoph Neidh\u00f6fer em teoria musical e nos Digital Composition Studios (opera\u00e7\u00e3o de patches Max/MSP em concertos de m\u00fasica mista). Workshops de nota\u00e7\u00e3o na Marvin Duchow Music Library.</p>
<p><strong>Assistente/Gerente de Produ\u00e7\u00e3o, Compositor e Palestrante, Festival M\u00fasica de Agora na Bahia (2012\u20132015)</strong><br>Projeto plurianual de m\u00fasica contempor\u00e2nea patrocinado pela Petrobras: quase 100 eventos, incluindo mais de 40 estreias de compositores brasileiros, e a\u00e7\u00f5es educativas para estudantes da rede p\u00fablica.</p></div>`

let cw=0,cp=0,cpf=0,wl='en',pl='en';

function enter(){document.getElementById('hero').classList.add('h');sw(0)}
function goHome(){document.getElementById('hero').classList.remove('h')}
function nav(n){document.querySelectorAll('.pane').forEach(p=>p.classList.remove('on'));document.getElementById('p-'+n).classList.add('on');['works','perf','res','contact'].forEach((nm,i)=>{document.querySelectorAll('.nb')[i].classList.toggle('on',nm===n)})}

function wsub(s){
  document.getElementById('wsub-comp').style.display=s==='comp'?'flex':'none';
  document.getElementById('wsub-other').style.display=s==='other'?'block':'none';
  document.querySelectorAll('#wst .stab').forEach((b,i)=>b.classList.toggle('on',['comp','other'][i]===s));
  if(s==='other'){
    let h='';OW.forEach(o=>{const meta=[o.i,o.d,o.e,o.p].filter(Boolean).join(' \u00b7 ');const lks=o.l.map(([n,u])=>`<a href="${GDU(u)}" target="_blank">${n}</a>`).join(' \u00b7 ');h+=`<div class="ow"><span class="oy">${o.y}</span><strong>${o.t}</strong><br>${meta}${lks?'<br>'+lks:''}</div>`});
    document.getElementById('owlist').innerHTML=h;
  }
}

function bc(){
  let h='';WK.forEach((w,i)=>{h+=`<button class="${i===cw?'on':''}" onclick="sw(${i})"><div class="y">${w.y}</div><div class="t">${w.t}</div></button>`});
  document.getElementById('wc').innerHTML=h;
  h='';PF.forEach((p,i)=>{h+=`<button class="${i===cpf?'on':''}" onclick="spf(${i})"><div class="y">${p.y}</div><div class="t">${p.t}</div></button>`});
  document.getElementById('pc').innerHTML=h;
}

function sw(i){cw=i;cp=0;const w=WK[i];document.getElementById('si').src=w.pp[0];document.getElementById('sc').textContent=`1/${w.pp.length}`;document.getElementById('sv').classList.remove('z');document.getElementById('si').style.width='';uwi();bc()}

function uwi(){
  const w=WK[cw];const e=wl==='en';
  let h=`<div class="lbl">${w.y} \u00b7 ${cw===0?(e?'Dissertation Work':'Obra de Doutorado'):(e?(w.de.split('\u00b7')[1]||'').trim():(w.dp.split('\u00b7')[1]||'').trim())}</div>`;
  h+=`<h2>${w.t}</h2><div class="inst">${e?w.ie:w.ip}</div><div class="det">${e?w.de:w.dp}</div>`;
  const cx=e?w.ce:w.cp;if(cx)h+=`<div class="det">${cx}</div>`;
  h+=`<div style="margin:12px 0"><button class="lang ${wl==='en'?'on':''}" onclick="wl='en';uwi()">EN</button><button class="lang ${wl==='pt'?'on':''}" onclick="wl='pt';uwi()">PT</button></div>`;
  h+=`<div class="desc">${e?w.ne:w.np}</div><div>${w.lk}</div>`;
  if(w.au&&w.au.length>0){w.au.forEach(a=>{h+=`<div class="ap"><div class="al">${a.n}</div><div class="asub">${a.sub||''}</div><audio controls preload="metadata" src="${a.s}"></audio></div>`})}
  document.getElementById('wi').innerHTML=h;
}

function pg(d){
  const w=WK[cw];const np=cp+d;
  if(np>=0&&np<w.pp.length){
    cp=np;document.getElementById('si').src=w.pp[cp];
    document.getElementById('sc').textContent=`${cp+1}/${w.pp.length}`;
    document.getElementById('sv').classList.remove('z');
    document.getElementById('si').style.width='';
  }
}

function doZoom(){
  const sv=document.getElementById('sv');
  const img=document.getElementById('si');
  sv.classList.toggle('z');
  img.style.width=sv.classList.contains('z')?'220%':'';
  if(!sv.classList.contains('z')){sv.scrollTop=0;sv.scrollLeft=0}
}

function spf(i){
  cpf=i;const p=PF[i];const e=pl==='en';
  document.getElementById('pfi').src=PFIMG[i];
  let h=`<div class="lbl">${p.y}${p.co?' \u00b7 '+(e?'with':'com')+' '+p.co:' \u00b7 Solo'}</div>`;
  h+=`<h2>${p.t}</h2>`;
  if(p.s)h+=`<div style="font-family:var(--serif);font-size:14px;font-style:italic;color:var(--mu);margin-bottom:8px">${p.s}</div>`;
  h+=`<div class="inst">${e?p.ie:p.ip}</div><div class="det">${e?p.de:p.dp}</div>`;
  h+=`<div style="margin:12px 0"><button class="lang ${pl==='en'?'on':''}" onclick="pl='en';spf(${cpf})">EN</button><button class="lang ${pl==='pt'?'on':''}" onclick="pl='pt';spf(${cpf})">PT</button></div>`;
  h+=`<div class="desc">${e?p.ne:p.np}</div>`;
  // Links
  if(p.gd)h+=`<a class="link hi" href="${p.gd}" target="_blank">\u25b6 Watch (GDrive)</a>`;
  if(p.yt)h+=`<a class="link${p.gd?'':' hi'}" href="${p.yt}" target="_blank">\u25b6 Watch (YouTube)</a>`;
  if(p.sc)h+=`<a class="link hi" href="${p.sc}" target="_blank">\u25b6 Listen (SoundCloud)</a>`;
  if(p.w)h+=`<a class="link" href="${p.w}" target="_blank">Project Site \u2197</a>`;
  if(p.sp)h+=`<a class="link" href="${p.sp}" target="_blank">\u266b Spotify</a>`;
  document.getElementById('pi').innerHTML=h;
  // Play button links to GDrive if available, else YouTube
  document.getElementById('pvl').href=p.gd||p.yt||p.sc||'#';
  document.getElementById('pvt').textContent=i===2?'Listen':'Watch Performance';
  bc();
}

function rl(l){document.getElementById('rt').innerHTML=RES[l];document.querySelectorAll('#p-res .lang').forEach(b=>b.classList.toggle('on',b.textContent===l.toUpperCase()))}
function cl2(l){document.getElementById('ct2').innerHTML=CON[l];document.querySelectorAll('#p-contact .lang').forEach(b=>b.classList.toggle('on',b.textContent===l.toUpperCase()))}
function olb(s){document.getElementById('lbi').src=s;document.getElementById('lb').classList.add('on')}
function clb(){document.getElementById('lb').classList.remove('on')}

// ARROW KEYS - fixed
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'){e.preventDefault();pg(1)}
  if(e.key==='ArrowLeft'){e.preventDefault();pg(-1)}
  if(e.key==='Escape')clb();
});

// Init
bc();sw(0);spf(0);rl('en');cl2('en');wsub('comp');
